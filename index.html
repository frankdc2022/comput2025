<html>
<head>
    <title>Inicio de Sesión</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
            animation: fadeInUp 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            60% {
                opacity: 1;
                transform: translateY(-8px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .login-container h1 {
            margin-bottom: 1.5rem;
            color: #2575fc;
        }
        .login-container input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .login-container button {
            width: 100%;
            padding: 0.7rem;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
        }
        .login-container .footer {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Inicio de Sesión</h1>
        <form id="loginForm">
            <input type="text" placeholder="Usuario" required>
            <input type="password" placeholder="Contraseña" required>
            <button type="submit" id="loginBtn">Ingresar</button>
        </form>
        <div class="footer">¿Olvidaste tu contraseña?</div>
    </div>
    <audio id="loginSound" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12b6b2b7c7.mp3"></audio>
    <script>
        // Reproduce el sonido al hacer clic en el botón y al enviar el formulario
        const loginSound = document.getElementById('loginSound');
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.addEventListener('click', function() {
            loginSound.play();
        });
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            loginSound.play();
            // Aquí puedes agregar lógica adicional para el inicio de sesión
        });
    </script>
</body>
</html>
